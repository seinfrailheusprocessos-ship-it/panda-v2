<style id="css">
:root{
  --bg:#e9eef4;--card:#ffffff;--ink:#383c42;--ink2:#4a4f56;--muted:#737a84;--faint:#9aa1aa;
  --line:#dfe4ea;--line2:#eef1f5;--sand:#55595f;--accent:#3a6fb0;--accent2:#2f5f9a;--accent-soft:#e3ecf7;
  --bar:#d6e3f1;--barl:#c3d4e7;--btn:#f4f6f8;--btnl:#c5cbd3;
  --ok:#4f7d52;--ok-soft:#e5efe3;--warn:#a86a14;--warn-soft:#f6ecd9;--danger:#b3261e;--danger-soft:#f7e1df;
  --azul:#3a6fb0;--azul-soft:#e3ecf7;--roxo:#6a5ea8;--roxo-soft:#ece9f6;--home:#3a6fb0;--home-soft:#e3ecf7;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --doc:Tinos,"Liberation Serif","Times New Roman",Times,serif;
  --r:14px;--sh:0 1px 2px rgba(30,40,55,.06),0 6px 20px rgba(30,40,55,.06);
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{width:20px;height:20px;flex:none}
#app{position:fixed;inset:0;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}

/* ---------- botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.soft{background:var(--line2);border-color:var(--line2)}
.btn.danger{color:var(--danger);border-color:#ecc9c5;background:#fff}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:var(--ink2);flex:none}
.ib:active{background:var(--line2)}
.ib.sm{width:34px;height:34px;border-radius:10px}
.ib.round{border-radius:50%;border:1px solid var(--line);background:var(--card)}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp,.sel,.txa{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);outline:none}
.txa{resize:vertical;min-height:84px;line-height:1.45}
.inp:focus,.sel:focus,.txa:focus{border-color:#9fb8d6;box-shadow:0 0 0 3px rgba(58,111,176,.14)}
button.sel{text-align:left;color:var(--ink);font-weight:500;background:var(--card) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 fill=%27none%27 stroke=%27%23737a84%27 stroke-width=%271.6%27/%3E%3C/svg%3E") no-repeat right 14px center;padding-right:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 2px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.sh .shh h3:empty{display:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;background:var(--line2);color:var(--ink2);font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent2)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--line2);gap:2px}
.seg button{flex:1;min-height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink2);font-size:16px;margin-bottom:4px}

/* ---------- início ---------- */
.topo{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 18px;padding-top:max(10px,env(safe-area-inset-top))}
.marca{font:600 25px/1 var(--serif);letter-spacing:-.01em;flex:1}
.marca small{font:500 12px var(--ui);color:var(--faint);margin-left:6px;letter-spacing:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 18px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px 14px;border:1px solid var(--line);border-radius:18px;background:var(--card);text-align:left;box-shadow:var(--sh);min-height:128px}
.tile .tic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent2)}
.tile.b .tic{background:var(--line2);color:var(--ink2)}
.tile b{font-size:16px;font-weight:600}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.35}
.tile svg{width:22px;height:22px}
.hbar{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.busca{display:flex;align-items:center;gap:8px;flex:1;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.busca input{flex:1;border:0;outline:0;background:transparent;min-width:0;height:40px}
.busca svg{color:var(--faint);width:18px;height:18px}
.plist{display:flex;flex-direction:column;gap:10px}
.pc{display:flex;flex-direction:column;gap:6px;padding:14px 14px 12px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:left;width:100%}
.pc:active{background:#fdfcf9}
.pc .l1{display:flex;align-items:center;gap:8px}
.pc .num{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .obj{color:var(--ink2);font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .l3{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.pc.av{background:transparent;border-style:dashed}
.sec-t{display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.sec-t h3{margin:0;font:600 17px var(--serif);flex:1}
/* tela inicial: ver o bloco "Panda" no fim */
/* ---------- barra de topo das telas ---------- */
.tb{display:flex;align-items:center;gap:4px;min-height:54px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
.tb h2{flex:1;min-width:0;margin:0 4px;font:600 17px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb h2 small{display:block;font:500 12px var(--ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- mesa ---------- */
#vMesa{background:var(--sand)}
#mScreen{position:absolute;inset:0;overflow:hidden;background:var(--sand)}
.mbar{position:absolute;left:0;right:0;background:var(--bar);z-index:6;pointer-events:none}
.mbar.top{top:0;border-bottom:1px solid var(--barl)}
.mbar.bot{bottom:0;border-top:1px solid var(--barl)}
#doc{position:absolute;left:0;right:0;overflow:auto;z-index:1;overscroll-behavior:contain;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
#pages{display:flex;flex-direction:column;align-items:safe center;gap:14px;padding:16px 0 120px;min-width:100%;width:max-content;min-width:100%}
.dlabel{flex:none;display:flex;align-items:baseline;gap:8px;font:600 11.5px/1.2 var(--ui);color:#d9dde2;letter-spacing:.01em;margin:10px 0 -6px;user-select:none;-webkit-user-select:none}
.dlabel .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlabel .dfl{font-weight:500;color:#aeb4bc;white-space:nowrap}
.page{flex:none;position:relative;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);container-type:inline-size}
.page .fl{position:absolute;left:calc(100% + 5px);top:2px;font:600 10px/1.2 var(--ui);color:#c9ced6;white-space:nowrap;user-select:none;-webkit-user-select:none;pointer-events:none}
.page.pdf{overflow:visible}
.page.pdf canvas{display:block;width:100%;height:100%}
.page.pdf .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b6b2a6;font:12px var(--ui)}
.page.pdf .pb{position:absolute;top:6px;left:6px;display:flex;gap:4px}
.page.pdf .pb span{font:600 10px/1 var(--ui);padding:3px 6px;border-radius:6px;background:rgba(31,30,29,.72);color:#fff}
.page.cur{box-shadow:0 0 0 2px rgba(58,111,176,.75),0 1px 3px rgba(0,0,0,.3)}
.page.txt{aspect-ratio:1/1.4142;color:#2b2e33;font-family:var(--doc);padding-bottom:9.523cqw}
.page.txt .timbre{position:absolute;top:4.704cqw;left:51.19cqw;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;user-select:none;-webkit-user-select:none}
.page.txt .timbre img{width:8.662cqw;height:9.407cqw;object-fit:contain;margin-bottom:.84cqw}
.page.txt .timbre b{font-size:1.764cqw;line-height:2.2cqw;white-space:nowrap;font-weight:700}
.page.txt .timbre .rule{height:0;border-top:.168cqw solid #000;margin-top:.504cqw;align-self:center}
.page.txt.semtimbre .body{padding-top:9.523cqw}
.body{outline:none;caret-color:transparent;font-size:2.016cqw;line-height:1.27305;padding:23.809cqw 11.905cqw 0 14.286cqw}
.body>*{margin:0}
.body p{margin:0 0 1.008cqw;text-align:justify;text-indent:5.952cqw}
.body p.ni,.body p.bl,.body p.id,.body p.dt,.body li p,.body td p,.body th p{text-indent:0}
.body h1{font-size:2.016cqw;font-weight:700;text-align:center;text-transform:uppercase;margin:0 0 6.72cqw}
.body h1:has(+ .id){margin-bottom:0}
.body h1:has(+ .dt){margin-bottom:3.696cqw}
.body p.id{font-weight:700;text-align:center;text-transform:uppercase;margin:0 0 6.72cqw}
.body p.id:has(+ .dt){margin-bottom:3.696cqw}
.body p.dt{text-align:right;margin:0 0 3.024cqw;color:#2b2e33;user-select:none;-webkit-user-select:none}
.body p.bl{text-align:left;margin:0}
.body p.bl.sep{margin-top:2.016cqw}
.body p.bl + :not(.bl){margin-top:2.016cqw}
.body h2,.body h3{font-size:2.016cqw;font-weight:700;margin:2.016cqw 0 1.008cqw;text-align:left}
.body blockquote{margin:0 0 1.008cqw 19.048cqw;font-size:1.848cqw;line-height:1.107;text-align:justify}
.body blockquote p{text-indent:0;margin:0 0 1.008cqw}
.body sup.nr{font-size:62%;line-height:0;color:#1d4f8f;font-weight:700;cursor:pointer;padding:0 .1em}
.body hr.qp{border:0;border-top:1px dashed #9fb3cc;margin:2cqw -11.905cqw 2cqw -14.286cqw;height:0}
.body p.alin{padding-left:4.76cqw;text-indent:0}
.body ul,.body ol{padding-left:4.76cqw;margin:0 0 1.008cqw}
.body li{text-align:justify;margin:0 0 1.008cqw}
.body table{border-collapse:collapse;width:100%;font-size:1.68cqw;line-height:1.24;margin:1.008cqw 0}
.body th{background:#f1f3f5;font-weight:700;text-align:left;border-bottom:1.2px solid #9aa1aa;border-top:1px solid #9aa1aa;padding:.588cqw}
.body td{border-bottom:1px solid #d5d9de;padding:.588cqw;vertical-align:top}
.body td.n{text-align:right;font-variant-numeric:tabular-nums}
.body .fc{border-bottom:1px dotted #8fa8c8}
.body .fc.vazio,.body .campo{background:#e9f0f8;border-bottom:1px dashed #7d9cc4;color:#2f4f78;border-radius:2px}
.page.txt .fecho{padding:0 11.905cqw 0 14.286cqw;font-size:2.016cqw;line-height:1.27305;user-select:none;-webkit-user-select:none;cursor:pointer}
.page.txt .fecho .loc{margin-top:2.016cqw}
.page.txt .fecho .n1{margin-top:13.439cqw;text-align:center;font-weight:700}
.page.txt .fecho .loc + .n1{margin-top:13.439cqw}
.page.txt .fecho .n2{text-align:center;font-weight:700}
.page.txt .fecho .n1.vazio{color:#7d9cc4}
.page.txt .fecho.sem{display:none}
.page.txt .notasV{margin:3.5cqw 11.905cqw 0 14.286cqw;padding-top:1cqw;border-top:1px solid #9aa1aa;width:25%;font-size:1.68cqw;line-height:1.2}
.page.txt .notasV div{width:400%;text-align:justify;margin-bottom:.5cqw}
.page.txt .tarjaV{position:absolute;left:14.286cqw;right:11.905cqw;bottom:2.016cqw;margin:0;padding:0;font:1.21cqw/1.3 Arial,"Liberation Sans",Helvetica,sans-serif;text-align:justify;color:#8e8e93;user-select:none;-webkit-user-select:none;pointer-events:none}
.page.txt .brk{display:inline-block;position:relative;width:100%;vertical-align:top;user-select:none;-webkit-user-select:none;pointer-events:none;text-indent:0;font-size:0;line-height:0;z-index:2}
.page.txt .brk.bloco{display:block}
.page.txt .brk.fina{display:block;position:absolute;left:0;right:0;width:auto;height:0;border-top:1px dashed #9fb3cc}
.page.txt .brk .pgTarja{position:absolute;left:0;right:0;top:calc(var(--pb) - 2.016cqw);transform:translateY(-100%);font:1.21cqw/1.3 Arial,"Liberation Sans",Helvetica,sans-serif;color:#8e8e93;text-align:justify}
.page.txt .brk .pgFim{position:absolute;left:-40cqw;right:-40cqw;top:var(--pb);height:var(--gap);background:var(--bg);display:flex;align-items:center;justify-content:center;font:500 12px/1 var(--ui);color:#aeb4bc;box-shadow:inset 0 5px 5px -5px rgba(0,0,0,.16),inset 0 -5px 5px -5px rgba(0,0,0,.12)}
.page.txt .brk .pgTimbre{position:absolute;left:calc(51.19cqw - 14.286cqw);top:calc(var(--pb) + var(--gap) + 4.704cqw);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-family:var(--doc);color:#2b2e33}
.page.txt .brk .pgTimbre img{width:8.662cqw;height:9.407cqw;object-fit:contain;margin-bottom:.84cqw}
.page.txt .brk .pgTimbre b{font-size:1.764cqw;line-height:2.2cqw;white-space:nowrap;font-weight:700}
.page.txt .brk .pgTimbre .rule{height:0;border-top:.168cqw solid #000;margin-top:.504cqw;align-self:center}
.page.txt .brk .fl{top:calc(var(--pb) + var(--gap) + 2px);left:calc(100% + 11.905cqw + 5px)}
.page.txt .brk.fina .fl{top:-6px;left:calc(100% + 5px)}
.page.ph{aspect-ratio:1/1.414;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#a19f96;font:13px var(--ui);text-align:center;padding:20px}
.mEmpty{margin:40px 20px;max-width:420px;align-self:center;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.mEmpty b{color:var(--ink);font:600 19px var(--serif)}
.layer{position:absolute;inset:0;pointer-events:none;z-index:8}
.el{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;font-family:var(--ui);user-select:none;-webkit-user-select:none}
.el.icone{background:var(--btn);border:1px solid var(--btnl);color:var(--ink);font-size:10px;font-weight:600;line-height:1.05;text-align:center;padding:2px;overflow:hidden;box-shadow:0 1px 1px rgba(40,35,20,.04)}
.el.icone svg{width:19px;height:19px}
.el.icone.curto{font-size:16px;font-weight:600}
.el.icone.laranja{}
.el.icone.preto{background:#1f1e1d;border-color:#1f1e1d;color:#eceae3}
.el.icone.vidro{font-size:10.5px}
.el.icone.bola{border-radius:50%}
.el.icone.quad{border-radius:26%}
.el.icone.press{transform:translate(-50%,-50%) scale(.9);background:#e6eaef}

.el.icone.ativo{border-color:var(--accent);box-shadow:0 0 0 3px rgba(58,111,176,.25);color:var(--accent)}
.el.icone.a-marca::after{content:"";position:absolute;left:34%;right:34%;bottom:21%;height:3px;border-radius:2px;background:#f2cf55}
.el.traco{background:#cbc7bb;border-radius:3px}
.el.texto{color:var(--ink);font-size:14px;justify-content:flex-start;padding:0 6px;white-space:nowrap}
.el.texto .tx{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:inherit}
.el.texto.negrito{font-weight:600}
.el.titulo{flex-direction:column;align-items:flex-start;justify-content:center;padding:0 6px;line-height:1.15;white-space:nowrap;overflow:hidden}
.el.titulo b{font:600 14.5px var(--ui);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.el.titulo span{font-size:11.5px;color:#5d6570;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.el .tag{position:absolute;left:0;top:-14px;font-size:9px;font-weight:700;color:#6f6c64;background:rgba(255,255,255,.92);border-radius:4px;padding:0 3px;line-height:12px;pointer-events:none}
.el.sel{outline:2px dashed #2f6fed;outline-offset:3px;z-index:3}
.el .knob{position:absolute;right:-13px;bottom:-13px;width:22px;height:22px;border-radius:50%;background:#2f6fed;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.abaBtn{position:absolute;z-index:12;width:34px;height:34px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:var(--btn);border:1px solid var(--btnl);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.abaBtn svg{width:17px;height:17px}
#saProbe{position:absolute;visibility:hidden;pointer-events:none;width:0;height:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.abaBtn:active{transform:scale(.92);background:#f1efe8}
.abaBtn[hidden]{display:none}
.editing .abaBtn{outline:1.5px dashed rgba(47,111,237,.6);outline-offset:2px}
.scrim{position:absolute;inset:0;background:rgba(30,28,22,.22);z-index:15}
.panel{position:absolute;top:0;bottom:0;z-index:20;background:var(--bg);transition:transform .22s ease;box-shadow:0 0 22px rgba(40,35,20,.18);display:flex;flex-direction:column;max-width:560px}
.panel.left{left:0;transform:translateX(-104%)}
.panel.right{right:0;transform:translateX(104%)}
.panel.open{transform:none}
.ph{flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 16px;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.ph b{flex:1;font:600 17px var(--serif)}
.pbody{flex:1;overflow:auto;overscroll-behavior:contain;padding:12px 12px 30px;display:flex;flex-direction:column;gap:14px}
.pcard{background:var(--line2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pcard b{font-size:15px}
.pcard .o{color:var(--ink2);font-size:13.5px;line-height:1.35}
.pcard .chip{background:#fff}
.drow{display:flex;align-items:center;gap:4px;min-height:46px;padding:0 2px 0 6px;border-radius:12px}
.drow.cur{background:#f1eee6}
.drow .dash{flex:none;width:11px;height:3px;border-radius:2px;background:#c3bfb3;margin-right:6px}
.drow .nm{flex:1;min-width:0;border:0;background:none;text-align:left;padding:9px 0;display:flex;flex-direction:column;line-height:1.25}
.drow .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.drow .nm small{font-size:11.5px;color:var(--faint)}
.cb{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid #e6e3da;background:#fff;color:#4a4843;display:inline-flex;align-items:center;justify-content:center;padding:0;font:600 12px var(--ui)}
.cb svg{width:17px;height:17px}
.cb:disabled{opacity:.3}
.tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px}
.ab{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:2px;font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.2}
.ab i{width:46px;height:46px;border-radius:50%;border:1px solid #e6e3da;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal}
.ab.on i{border-color:var(--accent);background:var(--accent-soft);color:var(--accent2)}
.ab:disabled{opacity:.35}
.nitem{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line2)}
.nitem input[type=checkbox]{width:21px;height:21px;margin-top:1px;accent-color:var(--accent);flex:none}
.nitem .nt{flex:1;min-width:0;font-size:14.5px;line-height:1.4}
.nitem .nt small{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:12px;margin-top:2px}
.nitem .nt small a{color:var(--accent2);text-decoration:none;font-weight:600}
.nitem.ok .nt>span{color:var(--faint);text-decoration:line-through}
.nitem .tipo{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:#b9b5aa}
.nitem .tipo.pend{background:var(--accent)}
.nitem .tipo.def{background:#6b8fb3}
.nadd{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff}
.nadd textarea{border:0;outline:0;resize:none;min-height:54px;background:transparent;font-size:14.5px}
.kv{display:grid;grid-template-columns:minmax(100px,38%) 1fr;gap:7px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
#pill{position:absolute;left:50%;transform:translateX(-50%);z-index:14;display:flex;align-items:center;gap:4px;padding:4px;border-radius:20px;background:#fff;border:1px solid var(--line);font:600 12px var(--ui);box-shadow:var(--sh)}
#pill button{border:0;border-radius:14px;min-width:32px;height:28px;padding:0 10px;background:var(--line2);font-weight:600}
#pill span{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
#fmt{position:absolute;left:8px;right:8px;z-index:14;display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
#fmt button{min-height:34px;min-width:38px;padding:0 9px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);font-weight:600;font-size:13px}

/* ---------- editor de botões ---------- */
#tools{position:absolute;left:0;right:0;z-index:50;background:#fff;display:flex;flex-direction:column;max-height:58%;box-shadow:0 -6px 24px rgba(0,0,0,.18);font-size:13.5px}
#tools.b{bottom:0;border-radius:16px 16px 0 0}
#tools.t{top:0;border-radius:0 0 16px 16px}
#tools .hd{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
#tools .hd b{flex:1;min-width:90px}
#tools .bd{overflow:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px}
#tools .rg{display:flex;align-items:center;gap:8px}
#tools .rg span{min-width:128px;font-size:12.5px;color:var(--muted)}
#tools .rg input{flex:1;accent-color:var(--accent)}
#tools .rg em{font-style:normal;min-width:48px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- relatório ---------- */
.rsec{margin-top:16px}
.rsec>h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:600 16px var(--serif)}
.rsec>h3 span{flex:1}
.rbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ttab{width:100%;border-collapse:collapse;font-size:13.5px}
.ttab th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1.5px solid var(--line)}
.ttab td{padding:8px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
.ttab tr.cur td{background:#fbf4ef}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- folhas (sheets) ---------- */
#sheets{position:fixed;inset:0;z-index:80;pointer-events:none}
.sh-bg{position:absolute;inset:0;background:rgba(30,28,22,.32);pointer-events:auto;animation:fade .15s}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);pointer-events:auto;animation:up .2s ease;padding-bottom:env(safe-area-inset-bottom)}
.sh.cheio{top:0;max-height:none;border-radius:0}
.sh .shh{display:flex;align-items:center;gap:6px;padding:12px 8px 8px 18px}
.sh .shh h3{flex:1;margin:0;font:600 18px var(--serif)}
.sh .shb{flex:1;overflow:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.sh .shb>*,.pbody>*{flex-shrink:0}
a.btn{text-decoration:none}
.sh .shf{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line2);flex-wrap:wrap}
.sh .shf .btn{flex:1}
@media (min-width:720px){.sh{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:86%;transform:translate(-50%,-50%);border-radius:20px;animation:fade .15s}.sh.cheio{top:50%;height:86%;border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mitem{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 6px;border:0;background:none;text-align:left;border-radius:12px;font-size:15px}
.mitem:active{background:var(--line2)}
.mitem svg{color:var(--muted)}
.mitem.danger{color:var(--danger)}.mitem.danger svg{color:var(--danger)}
.mitem small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.msep{height:1px;background:var(--line);margin:4px 0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:var(--card);text-align:left;min-height:62px}
.mopt b{font-size:14px;font-weight:600}
.mopt span{font-size:12px;color:var(--muted);line-height:1.3}
.mopt.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,119,87,.2)}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.opt input{accent-color:var(--accent);width:19px;height:19px}
.fgrp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrp .fld.w2{grid-column:1/-1}
.fgrp .fld{justify-content:flex-end}
.zitem{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2)}
.zitem input{width:20px;height:20px;accent-color:var(--accent)}
#rvOut{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:100px;font:15px/1.55 var(--doc);background:#fff;white-space:pre-wrap;outline:none}
.msg{max-width:92%;padding:9px 11px;border-radius:12px;white-space:pre-wrap;font:14px/1.5 var(--doc)}
.msg.u{align-self:flex-end;background:var(--line2)}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.tgrid{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:42vh;background:#fff}
.tgrid table{border-collapse:collapse}
.tgrid td{padding:2px;border-bottom:1px solid var(--line2)}
.tgrid input{width:96px;border:1px solid transparent;border-radius:7px;padding:7px;font:13.5px var(--doc);background:#fff;outline:none}
.tgrid input:focus{border-color:var(--accent)}
.tgrid tr.h input{font-weight:700;background:#f4f3ee}
.stp{display:inline-flex;align-items:center;gap:6px}
.stp b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- prévia ---------- */
#vPrev{z-index:70;background:#e4e2da}
#prevPages{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 40px}
#prevPages canvas{display:block;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);width:min(92vw,760px);height:auto}

/* ---------- avisos ---------- */
#toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:95;max-width:88%;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:rgba(31,30,29,.94);color:#faf9f5;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast button{border:0;background:none;color:#f3b79f;font-weight:700;padding:4px}
#busy{position:fixed;inset:0;z-index:99;background:rgba(250,249,245,.7);display:flex;align-items:center;justify-content:center}
#busy div{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;background:#fff;box-shadow:var(--sh);border:1px solid var(--line);font-weight:500}
#busy i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =================== Panda =================== */
body[data-tab="rels"]{--home:var(--roxo);--home-soft:var(--roxo-soft)}
#vHome{background:var(--bg)}
#vHome .topo{background:var(--bar);border-bottom:1px solid var(--barl);padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));gap:10px}
.htabs{flex:1;max-width:none;background:rgba(40,60,90,.08);border-radius:12px;padding:3px;display:flex;gap:2px}
.htabs button{flex:1;min-height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:14px}
.htabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
body[data-tab="rels"] .htabs button.on{color:var(--roxo)}
.hbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--btnl);background:var(--btn);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.hbtn svg{width:19px;height:19px}
.hbtn:active{transform:scale(.93);background:#e6eaef}
#vHome .wrap{padding-bottom:96px}
.dots{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;margin:18px 0 18px;justify-items:center}
.dot{width:58px;height:58px;border-radius:50%;background:var(--btn);border:1px solid var(--btnl);display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .1s}
.dot svg{width:25px;height:25px}
.dot:active{transform:scale(.92);background:#e6eaef}
.dot.fut{color:#8c939c}
.hl{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.hl small{font-size:11.5px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--faint)}
.hcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;margin-bottom:9px;width:100%;text-align:left;color:var(--ink)}
.hcard .cat{width:10px;height:10px;border-radius:50%;flex:none;background:#b9bfc7}
.cat.licitacoes{background:var(--azul)}.cat.aditivos{background:#c9822b}.cat.diversos{background:#8a6fb0}.cat.av{background:#9aa1aa}
.hcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hcard .tx b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .tx span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .chip{background:var(--home-soft);color:var(--home)}
.mini{display:flex;gap:5px;flex:none}
.mini button,.mini em{width:28px;height:28px;border-radius:50%;border:1px solid var(--btnl);background:var(--btn);font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0}
.mini button svg{width:14px;height:14px}
.mini button:active{background:#e6eaef}
.mini .on{color:var(--home);border-color:var(--home)}
.hvazio{border:1px dashed var(--btnl);border-radius:16px;padding:16px;color:var(--muted);font-size:13.5px;text-align:center}
.hpe{position:absolute;left:0;right:0;bottom:0;height:0;z-index:5}
.hpe .hbtn{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom))}
.verBadge{position:absolute;left:62px;bottom:calc(26px + env(safe-area-inset-bottom));font:700 10.5px var(--ui);letter-spacing:.06em;color:var(--faint);pointer-events:none}
.pandaLogo{position:absolute;right:62px;bottom:calc(19px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:row-reverse;align-items:center;gap:6px;border:0;background:none;padding:2px}
.pandaLogo img{width:34px;height:auto;display:block;opacity:.85}
.pandaLogo span{font:700 15px var(--ui);letter-spacing:.02em;color:#4b5a70;max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .25s ease,opacity .2s ease}
.pandaLogo.on span{max-width:80px;opacity:1}
#hScrim{position:absolute;inset:0;background:rgba(20,28,40,.35);z-index:30}
#hPanel{position:absolute;top:0;bottom:0;left:0;width:min(88%,460px);z-index:31;background:var(--bg);box-shadow:6px 0 24px rgba(0,0,0,.2);transform:translateX(-104%);transition:transform .22s ease;display:flex;flex-direction:column}
#hPanel.open{transform:none}
#hPanel .ph{display:flex;align-items:center;gap:8px;padding:12px 12px 6px 16px;padding-top:max(12px,env(safe-area-inset-top))}
#hPanel .ph b{flex:1;font-size:19px}
#hPanel .pb{flex:1;overflow:auto;padding:4px 12px 90px}
.qrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px 9px 12px;margin-bottom:7px;width:100%;text-align:left;color:var(--ink)}
.qrow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.qrow .tx b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tx span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.acc>button{display:flex;align-items:center;width:100%;border:0;background:none;padding:12px 12px 12px 14px;font-weight:700;font-size:14.5px;color:var(--ink);gap:8px;text-align:left}
.acc>button span{flex:1}
.acc>button small{color:var(--muted);font-weight:500}
.acc .it{border-top:1px solid var(--line);padding:8px 10px 8px 14px;display:flex;gap:8px;align-items:center}
.acc .it .tx{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer}
.acc .it .tx b{font-size:12.5px}
.acc .it .tx span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .cx{padding:7px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--line)}
.acc .add{border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:8px}
/* mesa: bolinhas flutuantes (signatário, novo documento, PDF) */
.mBub{position:absolute;z-index:12;width:34px;height:34px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:var(--btn);border:1px solid var(--btnl);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18);font:700 17px var(--ui)}
.mBub svg{width:17px;height:17px}
.mBub:active{transform:scale(.92);background:#e6eaef}
.mBub[hidden]{display:none}
.abaIn{position:absolute;z-index:22;width:34px;height:34px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:var(--btn);border:1px solid var(--btnl);color:var(--ink)}
.abaIn svg{width:17px;height:17px}
/* seleção de folhas */
.fsel{position:absolute;left:0;right:0;z-index:4;cursor:pointer}
.fsel>i{font-style:normal}
.fsel.on{background:rgba(58,111,176,.2)}
.fsel>i{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(40,50,65,.3);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.fsel.on>i{background:var(--accent)}
.fsel.on>i::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
#selBar{position:absolute;left:0;right:0;bottom:0;z-index:25;background:var(--bar);border-top:1px solid var(--barl);padding:10px 10px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#selBar .l{display:flex;align-items:center;gap:8px;font-size:13.5px}
#selBar .l b{flex:1}
#selBar .g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:0;font-size:11px;color:var(--ink);text-align:center;line-height:1.15}

.carV{position:absolute;z-index:3;pointer-events:none}

/* cursor fixo com bolinha vermelha */
#pages{position:relative}

#caret::after{content:"";position:absolute;left:50%;bottom:-6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#e03131}
/* aba do processo: numeração 1 ··· e anexos 1.1 */
.lrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 10px;margin-bottom:6px}

.lrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer}

/* caixa de novo documento */
.ndTop{display:flex;align-items:center;gap:8px}

.numrow button{min-width:44px;min-height:36px;border-radius:9px;border:1px solid var(--btnl);background:var(--btn);font:700 14px var(--ui);color:var(--ink);padding:0 8px}
.numrow button.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(58,111,176,.2);background:#fff}
.nprev{border:1px dashed #b9c6d6;border-radius:10px;padding:8px;text-align:center;font:700 12.5px/1.5 var(--doc);background:#fbfcfe;color:#2b2e33}
.optlist{display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow:auto}
.optlist button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;font-size:14.5px;color:var(--ink)}

/* revisão do texto inteiro */
.rvItem{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rvItem .at,.rvItem .nv{font:14.5px/1.5 var(--doc);text-align:justify}
.rvItem .lb{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.rvItem del{background:#fbe3e1;color:#9b2c24;text-decoration:line-through}
.rvItem ins{background:#e2f2e4;color:#2e6b36;text-decoration:none}
.rvItem.feito{opacity:.5}
/* folha nova provisória e cursor em modo seleção */
.body hr.qp.tmp{border-top-color:#e08a3a}
.tmpNovo{position:absolute;right:11.905cqw;z-index:5;border:1px solid var(--btnl);background:var(--btn);border-radius:14px;padding:4px 10px;font:700 11px var(--ui);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#mScreen.modoSel .page.txt .fecho{pointer-events:none}
.page.txt .fecho:active .n1{color:var(--accent)}
.dlabel{cursor:default}
#mScreen.modoSel .dlabel{color:#fff;cursor:pointer;text-decoration:underline dotted}
/* relatórios em roxo */
#vRel{--accent:var(--roxo);--accent2:#574b93;--accent-soft:var(--roxo-soft)}
#vRel .tb{background:#e7e3f4;border-bottom-color:#d3cdea}
/* impressão (app instalado): só as folhas escolhidas */
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{display:block;width:210mm;height:297mm;object-fit:contain;page-break-after:always;break-after:page}
}

/* =================== Panda · visual Apple (sobrepõe o que vem antes) =================== */
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--ink:#000000;--ink2:#1C1C1E;--muted:#6C6C70;--faint:#8E8E93;
  --line:#C6C6C8;--line2:#E5E5EA;--sand:#E5E5EA;--accent:#007AFF;--accent2:#0062CC;--accent-soft:rgba(0,122,255,.12);
  --bar:rgba(249,249,249,.94);--barl:#C6C6C8;--btn:rgba(118,118,128,.12);--btnl:transparent;--fill:rgba(118,118,128,.12);
  --ok:#248A3D;--ok-soft:rgba(52,199,89,.14);--warn:#C93400;--warn-soft:rgba(255,149,0,.14);--danger:#FF3B30;--danger-soft:rgba(255,59,48,.1);
  --azul:#007AFF;--azul-soft:rgba(0,122,255,.12);--roxo:#007AFF;--roxo-soft:rgba(0,122,255,.12);--home:#007AFF;--home-soft:rgba(0,122,255,.12);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Roboto,Arial,sans-serif;
  --serif:var(--ui);--r:10px;--sh:none;
}

/* botões e campos no estilo iOS */

.opt,.rbox,.pcard,.nadd,.mopt,.stat div{background:#fff;border:0;border-radius:10px}
.rbox{padding:10px 14px}

/* folhas (sheets) estilo iOS */
.sh-bg{background:rgba(0,0,0,.25)}
.sh{background:var(--bg);border-radius:12px 12px 0 0;box-shadow:none}

.dRow.capa .tx b{color:#3C3C43}
.dRow.vaga .dMain{padding-right:14px}
.dRow.vaga .dN{display:flex;justify-content:flex-end;color:#007AFF}
.dRow.vaga .dN svg{width:15px;height:15px}
.dRow.vaga .tx b{color:#007AFF}
/* novo processo: ficha de abertura */
.abSeg{margin:0 0 12px}
.abRow{gap:12px}
.abRow>span:first-child{flex:none}
.abInp{flex:1;min-width:0;border:0;background:none;text-align:right;font:15px var(--ui);color:#000;padding:0;outline:none}
.abObjRow{flex-direction:column;align-items:stretch;gap:2px;padding-top:10px;padding-bottom:8px}
.abObj{margin:0!important;text-indent:0;border:0;background:none;resize:none;font:15px/1.35 var(--ui);color:#000;padding:0;outline:none;min-height:42px;width:100%}
.abOp .abIc{display:flex;flex:none;width:30px;height:30px;border-radius:7px;background:#007AFF;color:#fff;align-items:center;justify-content:center}
.abOp .abIc svg{width:18px;height:18px}
.abOp .tx span{white-space:normal}
/* inteiro teor: os documentos reconhecidos */
.tpTeor{background:#fff;border-radius:10px;padding:10px 12px;font-size:13px}
.tpTeor b{font-weight:600}
.tpChips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tpChip{padding:3px 8px;border-radius:7px;background:rgba(118,118,128,.12);font-size:12px}
.tpChip.capa{background:none;box-shadow:inset 0 0 0 .5px #C6C6C8}

/* ===== Etapa 2 (28/09): cápsula, bolinhas do S, pandinho, marca-texto, selo, página inteira ===== */
#aBot [data-a="campo"],#aBot [data-a="ferramentas"],#aBot > i,#aBot .capGrade{display:none}
#aBot [data-a="expandir"]{background:#EAF2FF;color:var(--accent)}
#aBot [data-a="pginteira"]{display:none}
#aBot [data-a="selecionar"] .sBtn{color:var(--accent);font:700 21px/1 var(--ui)}
#aBot.aberta{flex-wrap:wrap;height:auto;width:min(372px,calc(100vw - 20px));border-radius:28px;padding:0 8px 1px;justify-content:space-around;gap:0}
#aBot.aberta .capGrade{display:grid;grid-template-columns:repeat(4,1fr);row-gap:6px;width:100%;padding:0 0 10px;margin-bottom:1px;border-bottom:.5px solid rgba(60,60,67,.2)}
#aBot.aberta [data-a="expandir"]{display:none}
#aBot .capAlca{grid-column:1/-1;width:100%;height:20px;border-radius:0;background:transparent;display:flex;align-items:center;justify-content:center}
#aBot .capAlca i{display:block;width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.24)}
#aBot .capB{width:auto;height:auto;flex-direction:column;gap:5px;padding:2px 0;border-radius:12px;color:#1C1C1E;background:transparent}
#aBot .capB .bola{width:46px;height:46px;border-radius:23px;background:#F2F2F7;color:var(--accent);display:flex;align-items:center;justify-content:center}
#aBot .capB .bola svg{width:22px;height:22px}
#aBot .capB small{font:500 12px/1.15 var(--ui);color:#3A3A3C;white-space:nowrap}
#aBot .capB.pri .bola,#aBot .capB.liga .bola{background:var(--accent);color:#fff}
#aBot .capB:active{background:transparent}
#aBot .capB:active .bola{filter:brightness(.9)}
body.pgInt #aBot [data-a="pginteira"]{display:flex;width:50px;height:50px;border-radius:25px;background:var(--accent);color:#fff}
body.pgInt #aBot [data-a="cima"],body.pgInt #aBot [data-a="baixo"]{display:none}
/* página inteira */
#pgIntV{position:fixed;left:0;right:0;z-index:9;background:#D8D8DE;display:flex;flex-direction:column;align-items:center;touch-action:pan-y}
#pgIntV .pgiArea{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding-top:14px}
#pgIntV .pgiFolha{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);transition:opacity .15s}
#pgIntV .pgiFolha.carregando{opacity:.55}
#pgIntV .pgiFolha canvas{display:block;width:100%;height:100%}
#pgIntV .pgiLeg{flex:none;padding:10px 16px calc(96px + env(safe-area-inset-bottom));font:400 15px/1.3 var(--ui);color:#3A3A3C}
/* bolinhas do S */
body.sAberto #aBot{opacity:.45}
#sCamada{position:fixed;inset:0;z-index:70}
#sCamada .sVeu{position:absolute;inset:0;background:rgba(242,242,247,.62)}
#sCamada .sCol{position:absolute;display:flex;flex-direction:column-reverse;gap:14px}
#sCamada .sLin{display:flex;align-items:center;gap:12px;animation:sSobe .18s ease both}
#sCamada .sLin:nth-child(2){animation-delay:.03s}#sCamada .sLin:nth-child(3){animation-delay:.06s}#sCamada .sLin:nth-child(4){animation-delay:.09s}
@keyframes sSobe{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#sCamada .sBol{width:56px;height:56px;border-radius:28px;border:0;background:#fff;color:var(--accent);font:700 22px/1 var(--ui);box-shadow:0 3px 12px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;padding:0}
#sCamada .sBol.it{font:italic 700 22px/1 Georgia,"Times New Roman",serif}
#sCamada .sBol.on{background:var(--accent);color:#fff}
#sCamada .sRot{background:#fff;border-radius:12px;padding:7px 12px;font:600 15px/1.1 var(--ui);color:#1C1C1E;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#sCamada .sVez{background:#1C1C1E;color:#fff;border-radius:10px;padding:6px 9px;font:700 13px/1 var(--ui)}
#sCamada .sAz{position:absolute;width:52px;height:52px;border-radius:26px;border:0;background:var(--accent);color:#fff;font:700 22px/1 var(--ui);box-shadow:0 3px 10px rgba(0,122,255,.35)}
/* cursor: a bolinha vermelha vira o pandinho */
#caret::after{display:none}
#caret .bola{position:absolute;left:50%;bottom:-13px;width:24px;height:24px;margin-left:-12px;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;cursor:grab}
#caret .bola::before{content:"";width:7px;height:7px;border-radius:50%;background:#e03131}
#caret .bola img{display:none;width:24px;height:24px;object-fit:contain}
#caret.panda .bola{width:36px;height:36px;margin-left:-18px;bottom:-40px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.22)}
#caret.panda .bola::before{display:none}
#caret.panda .bola img{display:block}
#caret.arrasto{opacity:0}
#pandinho{position:fixed;z-index:80;width:40px;height:40px;border-radius:20px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;pointer-events:none}
#pandinho img{width:28px;height:28px;object-fit:contain}
#travaAqui{position:fixed;z-index:79;pointer-events:none}
#travaAqui i{position:absolute;left:0;top:0;width:3px;border-radius:2px;background:var(--accent)}
#travaAqui span{position:absolute;left:8px;top:100%;margin-top:4px;background:#fff;color:var(--accent);font:700 13px/1 var(--ui);padding:5px 8px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.14);white-space:nowrap}
/* Copiar · Colar · Marca-texto */
#selAcoes{position:fixed;z-index:65;display:flex;gap:8px}
#selAcoes .saB{display:flex;align-items:center;gap:7px;height:42px;padding:0 16px;border:0;border-radius:21px;background:#1C1C1E;color:#fff;font:600 15px/1 var(--ui);box-shadow:0 3px 12px rgba(0,0,0,.2)}
#selAcoes .saB i{display:flex}#selAcoes .saB svg{width:17px;height:17px}
#selAcoes .saB.mt{background:#E6F0A3;color:#1C1C1E}
.body mark.mt{background:#EEF4BC;color:inherit;border-radius:2px;box-shadow:0 0 0 .6px #D2DD80;cursor:pointer}
.body mark.mt.com{box-shadow:0 0 0 .9px #BCCB57}
#mtCom{position:fixed;z-index:66;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:12px;display:flex;flex-direction:column;gap:8px}
#mtCom b{font:600 13px/1 var(--ui);color:#6b6b70}
#mtCom .row{display:flex;justify-content:space-between;gap:8px}
#mtCom .danger{color:#FF3B30}
/* selo do documento inteiro */
.page .seloB{position:absolute;top:10.5cqw;right:3cqw;z-index:3;width:30px;height:30px;border:0;border-radius:15px;padding:0;background:transparent;color:#C7C7CC;opacity:.55;display:flex;align-items:center;justify-content:center}
.page .seloB svg{width:22px;height:22px}
.page .seloB.on{opacity:1;background:var(--accent);color:#fff}
.page .seloI{position:absolute;top:calc(10.5cqw - 2px);right:calc(3cqw + 40px);z-index:3;width:34px;height:34px;border:0;border-radius:17px;background:#fff;color:var(--accent);font:italic 700 19px/1 Georgia,"Times New Roman",serif;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.page.inteiro::after{content:"";position:absolute;inset:0;background:rgba(0,122,255,.07);box-shadow:inset 0 0 0 2px var(--accent);pointer-events:none;z-index:2}
.page.pdf.inteiro::after{background:rgba(0,122,255,.1)}
.page .giroV{position:absolute;left:8px;z-index:3;display:flex;align-items:center;gap:4px;font:600 11px/1 var(--ui);color:#8E8E93;background:rgba(242,242,247,.9);border-radius:8px;padding:4px 7px;pointer-events:none}
.page .giroV svg{width:13px;height:13px}
/* documento novo em branco */
.page .ndBola{position:absolute;left:50%;top:calc(141.42cqw * .42);transform:translate(-50%,-50%);z-index:3;width:64px;height:64px;border:0;border-radius:32px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,122,255,.35)}
.page .ndBola svg{width:28px;height:28px}
/* panda só na tela inicial */
#pandaMesa,.pandaPg{display:none!important}
/* Etapa 3: campos de tocar e "+ Incluir novo" */
.pm-i.novo span{color:var(--accent);font-weight:600}
.fecho .loc,.fecho .n1,.fecho .n2{cursor:pointer;border-radius:4px}
.fecho .loc:active,.fecho .n1:active,.fecho .n2:active{background:rgba(0,122,255,.08)}

/* ===== Etapa 6: Mesa de PDF ampliada ===== */
#aBot .capMais{display:none}
#aBot.aberta.mesaPdf .capAlca{height:34px}
#aBot.aberta.mesaPdf .capMais{display:flex;position:absolute;top:4px;right:12px;width:30px;height:30px;border-radius:15px;background:#F2F2F7;color:var(--accent);align-items:center;justify-content:center;padding:0}
#aBot .capMais svg{width:17px;height:17px}
.tlay{position:absolute;inset:0;overflow:hidden;line-height:1;z-index:2;-webkit-text-size-adjust:none;text-size-adjust:none}
.tlay span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;font-family:sans-serif;cursor:text;user-select:text;-webkit-user-select:text}
.tlay br{user-select:none;-webkit-user-select:none}
.tlay ::selection{background:rgba(0,122,255,.28);color:transparent}
.pmkL,.bHitL{position:absolute;inset:0;pointer-events:none}
.pmkL{z-index:3;mix-blend-mode:multiply}.bHitL{z-index:4;mix-blend-mode:multiply}
.pmk{position:absolute;background:#EEF4BC;border-radius:2px;box-shadow:0 0 0 .6px #D2DD80;pointer-events:auto;cursor:pointer}
.pmk.com{box-shadow:0 0 0 1.2px #B7C65A}
.bHit{position:absolute;background:rgba(255,214,10,.5);border-radius:2px}
.bHit.at{background:rgba(255,149,0,.62)}
::highlight(busca){background-color:rgba(255,214,10,.5)}
::highlight(buscaAt){background-color:rgba(255,149,0,.62)}
#buscaBar{position:fixed;top:calc(58px + env(safe-area-inset-top));left:10px;right:10px;max-width:560px;margin:0 auto;z-index:45;display:flex;align-items:center;gap:4px;height:44px;padding:0 6px 0 10px;border-radius:14px;background:rgba(249,249,249,.97);box-shadow:0 4px 18px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#buscaBar .bIc{display:flex;color:#8E8E93}#buscaBar .bIc svg{width:17px;height:17px}
#buscaBar .bInp{flex:1;min-width:0;border:0;background:transparent;font:16px/1.2 var(--ui);color:#000;outline:none;padding:0 4px}
#buscaBar .bInp::-webkit-search-cancel-button{display:none}
#buscaBar .bCont{font:500 12px/1 var(--ui);color:#8E8E93;white-space:nowrap}
#buscaBar .bBt{width:34px;height:34px;border:0;border-radius:17px;background:transparent;color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
#buscaBar .bBt svg{width:18px;height:18px}
.orgSh .shh .orgTodas{margin-left:auto;margin-right:6px}
.orgDica{margin:0}
.orgG{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;padding:4px 2px 20px}
.orgC{display:flex;flex-direction:column;align-items:center;gap:5px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.orgF{position:relative;width:100%;background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.25);overflow:hidden;display:flex;align-items:center;justify-content:center}
.orgF canvas{display:block;width:100%;height:100%}
.orgC small{font:500 11px/1 var(--ui);color:#8E8E93}
.orgC.txt .orgF{background:#fff}
.orgT{display:flex;flex-direction:column;gap:4px;padding:8px;font:11px/1.25 var(--ui);color:#3A3A3C;text-align:center;overflow:hidden}
.orgT b{font-weight:600;color:#8E8E93;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.orgV{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 0 0 1.5px #C7C7CC;display:flex;align-items:center;justify-content:center;color:transparent}
.orgV svg{width:14px;height:14px}
.orgC.on .orgF{box-shadow:0 0 0 3px var(--accent)}
.orgC.on .orgV{background:var(--accent);box-shadow:none;color:#fff}
.orgSh:not(.marca) .orgV{display:none}
.orgC.ph{opacity:.3}
.orgGhost{position:fixed;z-index:200;pointer-events:none;transform:scale(1.06);opacity:.95}
.orgGhost .orgF{box-shadow:0 10px 26px rgba(0,0,0,.3)}
.fpL{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fpC{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#E5E5EA}
.fpC img{width:100%;height:100%;object-fit:cover;display:block}
.fpC small{position:absolute;left:5px;bottom:4px;font:600 11px/1 var(--ui);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.fpX{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:11px;border:0;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.fpX svg{width:12px;height:12px}
</style>
</head>
<body>
<div id="app">
  <!-- início -->
  <section class="view" id="vHome">
    <header class="aTopo"><button class="aIc" id="hRapido" data-lay="hRapido" aria-label="Acesso rápido"></button><div class="aSeg" id="homeTabs" data-lay="homeTabs" role="tablist"></div><button class="aIc" id="hAjustes" data-lay="hAjustes" aria-label="Ajustes"></button></header>
    <div class="scroll"><div class="wrap" id="homeBody"></div></div>
    <div class="hpe">
      <button class="pandaLogo" id="pandaLogo" data-lay="pandaLogo" aria-label="Panda"><img id="pandaImg" alt=""><span id="verBadge"></span></button>
      <button class="fab" id="hMais" data-lay="hMais" aria-label="Novo"></button>
    </div>
    <div id="hScrim" hidden></div>
    <aside id="hPanel" aria-label="Acesso rápido"></aside>
  </section>

  <!-- pastas (níveis) e tela do processo -->
  <section class="view" id="vPasta" hidden></section>
  <section class="view" id="vProc" hidden></section>

  <!-- mesa: leitura e edição do processo -->
  <section class="view" id="vMesa" hidden>
    <div id="mScreen">
      <div id="doc"><div id="pages"></div></div>
      <div class="mbar top" id="barTop"></div>
      <div class="mbar bot" id="barBot"></div>
      <div class="layer" id="L-tela"></div>
      <div id="saProbe" aria-hidden="true"></div>
      <button class="abaBtn l" id="edgeL" aria-label="Abrir a aba dos documentos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9 4.5v15M5.8 8.5h1M5.8 11.5h1M5.8 14.5h1"/></svg></button>
      <button class="abaBtn r" id="edgeR" aria-label="Abrir a aba de página e notas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M15 4.5v15M17.2 8.5h1M17.2 11.5h1M17.2 14.5h1"/></svg></button>
      <button class="mBub" id="bSig" aria-label="Signatário"></button>
      <button class="mBub" id="bNovo" aria-label="Novo documento">+</button>
      <button class="mBub" id="bPdf" aria-label="Opções do PDF" hidden></button>
      <div id="selBar" hidden></div>
      <button class="pandaMini" id="pandaMesa" data-lay="pandaMesa" aria-label="Panda: editar a tela"><img alt=""></button>
      <div id="aTop"><button class="aVolta" id="aHome" data-lay="aHome" aria-label="Voltar ao início"></button><button class="aTit" id="aTit" data-lay="aTit" aria-label="Documentos do processo"><b></b><span></span></button><button class="aBola" id="aSig" data-lay="aSig" aria-label="Signatário"></button><button class="aBola" id="aMais" data-lay="aMais" aria-label="Mais"></button></div>
      <div id="aBot" data-lay="aBot"><button data-a="selecionar" data-lay="bot-selecionar" aria-label="Selecionar"></button><button data-a="esq" data-lay="bot-esq" aria-label="Palavra anterior"></button><button data-a="cima" data-lay="bot-cima" aria-label="Parágrafo anterior"></button><button data-a="pginteira" aria-label="Voltar à folha grande"></button><button data-a="baixo" data-lay="bot-baixo" aria-label="Próximo parágrafo"></button><button data-a="dir" data-lay="bot-dir" aria-label="Próxima palavra"></button><i></i><button data-a="campo" data-lay="bot-campo" class="az" aria-label="Pular para o próximo campo"></button><button data-a="ferramentas" data-lay="bot-ferramentas" class="az" aria-label="Mais ferramentas de texto"></button><button data-a="expandir" data-lay="bot-expandir" aria-label="Abrir as ferramentas"></button></div>
      <div id="pill" hidden><button id="spdM" aria-label="Mais devagar">−</button><span id="spdV"></span><button id="spdP" aria-label="Mais rápido">+</button><button id="spdStop">Parar</button></div>
      <div id="fmt" hidden>
        <button data-f="bold"><b>N</b></button><button data-f="italic"><i>I</i></button><button data-f="underline"><u>S</u></button>
        <button data-f="justifyLeft">Esq.</button><button data-f="justifyCenter">Centro</button><button data-f="justifyRight">Dir.</button><button data-f="justifyFull">Just.</button>
        <button data-f="insertUnorderedList">• Lista</button><button data-f="insertOrderedList">1. Lista</button><button data-f="h2">Título</button><button data-f="p">Normal</button>
        <button data-f="removeFormat">Limpar</button><button data-f="undo" aria-label="Desfazer">↶</button><button data-f="redo" aria-label="Refazer">↷</button><button data-f="fechar" aria-label="Fechar">✕</button>
      </div>
      <div class="scrim" id="scrim" hidden></div>
      <aside class="panel left" id="pLeft" aria-label="Documentos do processo"></aside>
      <aside class="panel right" id="pRight" aria-label="Página, notas e ficha"></aside>
    </div>
    <div id="tools" class="b" hidden></div>
  </section>

  <!-- relatório / ficha do processo -->
  <section class="view" id="vRel" hidden>
    <div class="tb"><button class="ib" id="rBack" aria-label="Voltar"></button><h2 id="rTit"></h2><button class="btn sm" id="rMesa">Abrir processo</button></div>
    <div class="scroll"><div class="wrap" id="relBody"></div></div>
  </section>

  <!-- prévia de PDF gerado -->
  <section class="view" id="vPrev" hidden>
    <div class="tb"><button class="ib" id="pvBack" aria-label="Fechar prévia"></button><h2 id="pvTit">Prévia</h2><button class="btn sm acc" id="pvSend">Compartilhar</button></div>
    <div class="scroll"><div id="prevPages"></div></div>
  </section>
</div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="busy" hidden><div><i></i><span id="busyTxt">Preparando…</span></div></div>
<input type="file" id="fileIn" class="arqIn" accept="application/pdf,.pdf,image/*,.zip,application/zip" multiple>
<input type="file" id="bkFile" class="arqIn" accept=".zip,application/zip">
<input type="file" id="camIn" class="arqIn" accept="image/*" capture="environment">
<div id="printArea"></div>
<script src="app.js"></script>
